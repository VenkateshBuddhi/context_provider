[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-provider"
version = "0.1.0"
description = "Local Evidence-Based Context Handoff System & Python SDK for AI Coding Agents"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Venkatesh Buddhi" }
]
requires-python = ">=3.10"
keywords = [
    "ai-agents",
    "context-management",
    "mcp",
    "model-context-protocol",
    "llm",
    "memory",
    "handoff",
    "llama3",
    "modernbert",
    "autonomous-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "aiosqlite>=0.19.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]
ml = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
]
mcp = [
    "mcp>=1.0.0",
]
all = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/your-username/context_provider"
Documentation = "https://github.com/your-username/context_provider#readme"
Repository = "https://github.com/your-username/context_provider.git"
Issues = "https://github.com/your-username/context_provider/issues"

[project.scripts]
context = "context_provider.cli.commands:main"
context-provider = "context_provider.cli.commands:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["context_provider*"]

[tool.setuptools.package-data]
context_provider = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
